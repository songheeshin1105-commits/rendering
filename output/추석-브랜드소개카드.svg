<?xml version="1.0" encoding="UTF-8"?>
<!--
  고순 브랜드 소개 카드 (추석 3종) — 택배 동봉용
  크기: 105 x 99 mm  ( A4(210x297) 를 가로 2 x 세로 3 으로 나눈 1/6 조각 )
  1 유닛 = 1 mm

  일러스트레이터에서 수정하는 법
  - 이 파일을 그대로 열면 아트보드가 105 x 99mm 로 잡히고,
    모든 글자는 편집 가능한 텍스트로 들어옵니다.
  - 글꼴: 'EBS훈민정음새론' (brand-font 폴더). 없으면 자동 대체되니 설치 후 여세요.

  인쇄 넘기기 전 체크
  1) 글자 전체 선택 → [문자] > [윤곽선 만들기] 로 아웃라인화
  2) 필요하면 사방 3mm 도련(재단 여유) 추가
  3) 색상 모드 CMYK 로 변환
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="105mm" height="99mm" viewBox="0 0 105 99">

  <!-- 배경 -->
  <rect x="0" y="0" width="105" height="99" fill="#fefcf6"/>
  <rect x="0" y="0" width="2" height="99" fill="#e4dfac"/>
  <rect x="0.5" y="0.5" width="104" height="98" fill="none" stroke="#e5e0d2" stroke-width="0.3"/>

  <!-- ===== 로고 + 브랜드 소개 ===== -->
  <image x="9" y="9" width="24" height="9.4"
         xlink:href="data:image/png;base64,"/>

  <text font-family="'EBS훈민정음새론','Malgun Gothic',sans-serif" fill="#5f574c">
    <tspan x="9" y="26" font-size="2.7">고순은 전국의 들깨를 직접 찾아다니는 들깨연구가입니다.</tspan>
    <tspan x="9" y="30.4" font-size="2.7">소량씩 자주 착유해 가장 신선한 상태 그대로 보내드립니다.</tspan>
  </text>
  <text x="9" y="36.4" font-family="'EBS훈민정음새론','Malgun Gothic',sans-serif"
        font-size="2.7" font-weight="700" fill="#ea4c36">— 세상에서 가장 신선한 들기름</text>

  <!-- 가로 구분선 -->
  <line x1="9" y1="42" x2="96" y2="42" stroke="#e5e0d2" stroke-width="0.35"/>

  <!-- ===== 이번 추석 3종 ===== -->
  <text x="9" y="49" font-family="'EBS훈민정음새론','Malgun Gothic',sans-serif"
        font-size="2.4" letter-spacing="0.35" fill="#8a8172">이번 추석, 고순의 세 가지</text>

  <!-- 01 -->
  <text x="9" y="57" font-family="'EBS훈민정음새론','Malgun Gothic',sans-serif"
        font-size="3" font-weight="700" fill="#ea4c36">01</text>
  <text x="16" y="57" font-family="'EBS훈민정음새론','Malgun Gothic',sans-serif"
        font-size="3" font-weight="700" fill="#36302c">아, 향긋해 들기름</text>
  <text x="16" y="61.6" font-family="'EBS훈민정음새론','Malgun Gothic',sans-serif"
        font-size="2.4" fill="#5f574c">고순의 시그니처. 들깨 본연의 향긋함과 긴 여운을 살린 들기름.</text>

  <!-- 02 -->
  <text x="9" y="70.5" font-family="'EBS훈민정음새론','Malgun Gothic',sans-serif"
        font-size="3" font-weight="700" fill="#ea4c36">02</text>
  <text x="16" y="70.5" font-family="'EBS훈민정음새론','Malgun Gothic',sans-serif"
        font-size="3" font-weight="700" fill="#36302c">고순 햇참기름</text>
  <text font-family="'EBS훈민정음새론','Malgun Gothic',sans-serif" font-size="2.4" fill="#5f574c">
    <tspan x="16" y="75.1">2026년 햇참깨의 신선함을 더해 맑은 풍미를 살린 참기름.</tspan>
    <tspan x="16" y="78.7">8월이 제철인 참깨, 딱 지금만 만날 수 있는 신선함.</tspan>
  </text>

  <!-- 03 -->
  <text x="9" y="87" font-family="'EBS훈민정음새론','Malgun Gothic',sans-serif"
        font-size="3" font-weight="700" fill="#ea4c36">03</text>
  <text x="16" y="87" font-family="'EBS훈민정음새론','Malgun Gothic',sans-serif"
        font-size="3" font-weight="700" fill="#36302c">들깨오란다</text>
  <text x="16" y="91.6" font-family="'EBS훈민정음새론','Malgun Gothic',sans-serif"
        font-size="2.4" fill="#5f574c">설탕을 사용하지 않고 들깨가 듬뿍 들어간 고소한 들깨오란다.</text>

</svg>
