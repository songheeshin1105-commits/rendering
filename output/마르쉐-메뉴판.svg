<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 595.28 841.89">
  <defs>
    <style>
      .hand{ font-family:'Gaegu','EBS훈민정음새론',sans-serif; }
      .body{ font-family:'EBS훈민정음새론','Gaegu',sans-serif; }
    </style>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="595.28" height="841.89" fill="#f2e9d8"/>
  <!-- hand-drawn frame -->
  <rect x="22.68" y="22.68" width="549.92" height="796.53" rx="2" fill="none" stroke="#3a3128" stroke-width="1.4"/>

  <!-- header -->
  <text x="297.64" y="108" text-anchor="middle" class="hand" font-size="40" font-weight="700" fill="#3a3128">고순</text>
  <text x="297.64" y="132" text-anchor="middle" class="hand" font-size="15" fill="#3a3128">· 고순 서울 마포 ↗ ·</text>

  <line x1="80" y1="152" x2="515" y2="152" stroke="#3a3128" stroke-width="1.4" stroke-dasharray="4 4" opacity="0.35"/>

  <!-- headline -->
  <text x="297.64" y="190" text-anchor="middle" class="hand" font-size="21" font-weight="700" fill="#3a3128">고소함 뒤에 숨겨진 진짜 들깨의 향</text>
  <text x="297.64" y="218" text-anchor="middle" class="hand" font-size="21" font-weight="700" fill="#3a3128"><tspan fill="#b5432f">'향긋함'</tspan>을 느낄 수 있는 들기름이에요!</text>

  <!-- category 1: 들기름 -->
  <g transform="translate(80,236) scale(0.9167)">
    <path d="M12 21c0-6 1-10 6-14" fill="none" stroke="#6b7752" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M12 21c0-6-1-10-6-14" fill="none" stroke="#6b7752" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M6 7c3 1 5 3 6 6" fill="none" stroke="#6b7752" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M18 7c-3 1-5 3-6 6" fill="none" stroke="#6b7752" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <text x="112" y="256" class="hand" font-size="22" font-weight="700" fill="#3a3128">들기름</text>

  <text x="112" y="286" class="body" font-size="15" fill="#3a3128">아향긋해들기름</text>
  <line x1="300" y1="282" x2="460" y2="282" stroke="#3a3128" stroke-width="1.2" stroke-dasharray="1 3" opacity="0.4"/>
  <text x="515" y="286" text-anchor="end" class="hand" font-size="16" font-weight="700" fill="#3a3128">18,000원</text>

  <text x="112" y="310" class="body" font-size="15" fill="#3a3128">2026 햇참기름</text>
  <line x1="300" y1="306" x2="460" y2="306" stroke="#3a3128" stroke-width="1.2" stroke-dasharray="1 3" opacity="0.4"/>
  <text x="515" y="310" text-anchor="end" class="hand" font-size="16" font-weight="700" fill="#3a3128">20,000원</text>

  <!-- category 2: 9월의 들기름 페어링 한상 -->
  <g transform="translate(80,330) scale(0.9167)">
    <path d="M4 12a8 8 0 0 0 16 0z" fill="none" stroke="#6b7752" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M2 12h20" fill="none" stroke="#6b7752" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M12 4v2" fill="none" stroke="#6b7752" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <text x="112" y="350" class="hand" font-size="22" font-weight="700" fill="#3a3128">9월의 들기름 페어링 한상</text>
  <text x="112" y="368" class="body" font-size="12" fill="#8a6a45">(향긋한 들기름 × 호박잎)</text>

  <text x="80" y="392" class="body" font-size="12.5" fill="#3a3128">9월에 소개할 들기름의 '향긋함'과 페어링할 재료는</text>
  <text x="80" y="409" class="body" font-size="12.5" fill="#3a3128">'호박잎'입니다. 엄마가 직접 수확한 호박잎을 넣은</text>
  <text x="80" y="426" class="body" font-size="12.5" fill="#3a3128">솥밥과 할머니 특별 레시피 들기름강된장! 솥밥에</text>
  <text x="80" y="443" class="body" font-size="12.5" fill="#3a3128">들기름을 휘휘 둘러, 향긋한 풍미를 천천히 맛보세요.</text>
  <text x="80" y="460" class="body" font-size="12.5" fill="#3a3128">여기에 즉석 들기름두부구이와 11년 숙성 간장까지,</text>
  <text x="80" y="477" class="body" font-size="12.5" fill="#3a3128">한 상 차려 마르쉐에서 기다릴게요.</text>

  <text x="112" y="504" class="body" font-size="15" fill="#3a3128">솥밥 들기름 페어링 한상</text>
  <line x1="335" y1="500" x2="460" y2="500" stroke="#3a3128" stroke-width="1.2" stroke-dasharray="1 3" opacity="0.4"/>
  <text x="515" y="504" text-anchor="end" class="hand" font-size="16" font-weight="700" fill="#3a3128">17,500원</text>

  <!-- category 3: 들깨 오란다 -->
  <g transform="translate(80,528) scale(0.9167)">
    <circle cx="12" cy="12" r="8" fill="none" stroke="#6b7752" stroke-width="1.6"/>
    <path d="M9 10h.01M15 9h.01M12 14h.01M9.5 15.5h.01" fill="none" stroke="#6b7752" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <text x="112" y="548" class="hand" font-size="22" font-weight="700" fill="#3a3128">들깨 오란다</text>

  <text x="80" y="570" class="body" font-size="12.5" fill="#3a3128">직접 만든 들깨 오란다: 당을 최소화하고, 올리고당으로만</text>
  <text x="80" y="587" class="body" font-size="12.5" fill="#3a3128">단 맛을 냈습니다. 부드럽게 바삭해서 이에 끼지도 않고,</text>
  <text x="80" y="604" class="body" font-size="12.5" fill="#3a3128">입천장이 까지지도 않는 오란다에요.</text>

  <text x="112" y="630" class="body" font-size="15" fill="#3a3128">오란다3SET</text>
  <line x1="300" y1="626" x2="460" y2="626" stroke="#3a3128" stroke-width="1.2" stroke-dasharray="1 3" opacity="0.4"/>
  <text x="515" y="630" text-anchor="end" class="hand" font-size="16" font-weight="700" fill="#3a3128">15,000원</text>

  <text x="112" y="654" class="body" font-size="15" fill="#3a3128">오란단 단품</text>
  <line x1="300" y1="650" x2="460" y2="650" stroke="#3a3128" stroke-width="1.2" stroke-dasharray="1 3" opacity="0.4"/>
  <text x="515" y="654" text-anchor="end" class="hand" font-size="16" font-weight="700" fill="#3a3128">5,500원</text>

  <!-- footer -->
  <text x="297.64" y="802" text-anchor="middle" class="hand" font-size="14" fill="#8a6a45">재료 소진 시 조기 마감될 수 있어요 :)</text>
</svg>
