<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>9월 주문·배송 안내</title>
<style>
  @font-face{ font-family:'Pretendard'; src:url('../brand-font/PretendardVariable.ttf') format('truetype-variations'); font-weight:100 900; font-display:swap; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:#fefcf6; color:#36302c; font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif; -webkit-font-smoothing:antialiased; }
  .page{ max-width:500px; margin:0 auto; background:#fefcf6; }

  .card{ margin:24px 18px; padding:34px 22px 28px; border:1px solid #e5e0d2; border-radius:22px; background:#fefcf6; text-align:center; }
  .brand{ height:26px; margin:0 auto 20px; display:block; }
  .brand-txt{ font-weight:800; letter-spacing:.28em; font-size:16px; margin-bottom:20px; }
  .title{ font-size:24px; font-weight:800; letter-spacing:-.01em; margin-bottom:6px; }
  .subtitle{ font-size:13.5px; color:#8a8172; margin-bottom:28px; }

  .grid{ display:grid; grid-template-columns:repeat(7,1fr); }
  .dow{ font-size:12.5px; font-weight:800; color:#a49b88; padding-bottom:14px; }
  .dow.sun,.dow.hol{ color:#ea4c36; }
  .dow.sat{ color:#8a9bb0; }
  .cell{ min-height:78px; padding-top:8px; }
  .cell .d{ display:inline-flex; align-items:center; justify-content:center; width:42px; height:42px; border-radius:50%; font-size:18px; font-weight:600; line-height:1; color:#4c453c; }
  .cell .d.sun{ color:#ea4c36; }
  .cell.mark .d{ background:#e4dfac; font-weight:800; color:#36302c; }
  .cell.ship .d{ background:#d9e657; font-weight:800; color:#36302c; }
  .cell.hol .d{ background:#fbe3df; font-weight:800; color:#ea4c36; }
  .cell .tag{ display:block; font-size:11px; font-weight:800; margin-top:6px; letter-spacing:-.02em; }
  .cell.mark .tag{ color:#8a7f45; }
  .cell.ship .tag{ color:#5a5f1e; }
  .cell.hol .tag{ color:#ea4c36; }

  .divider{ border-top:1px solid #e5e0d2; margin:24px 0 18px; }
  .legend{ display:flex; gap:18px; justify-content:center; flex-wrap:wrap; font-size:12px; color:#8a8172; margin-bottom:16px; }
  .legend i{ display:inline-block; width:11px; height:11px; border-radius:50%; margin-right:6px; vertical-align:-1px; }
  .legend .l1 i{ background:#e4dfac; }
  .legend .l2 i{ background:#d9e657; }
  .legend .l3 i{ background:#fbe3df; }
  .note{ font-size:13px; color:#5f574c; line-height:1.8; }
  .note b{ color:#36302c; font-weight:800; }
  .note .red{ color:#ea4c36; font-weight:800; }
  .sign{ margin-top:16px; }
  .sign img{ height:20px; margin:0 auto; display:block; opacity:.8; }
  .sign .brand-txt{ font-size:13px; margin-bottom:0; }
</style>
</head>
<body>
<div class="page">
  <div class="card">
    <div class="title">9월 주문·배송 안내</div>
    <div class="subtitle">예약 주문을 모아 한 번에 착유해 보내드립니다</div>

    <div class="grid">
      <div class="dow sun">일</div><div class="dow">월</div><div class="dow">화</div><div class="dow">수</div><div class="dow">목</div><div class="dow">금</div><div class="dow sat">토</div>

      <div class="cell"><span class="d sun">13</span></div>
      <div class="cell mark"><span class="d">14</span><span class="tag">착유</span></div>
      <div class="cell"><span class="d">15</span></div>
      <div class="cell ship"><span class="d">16</span><span class="tag">발송 시작</span></div>
      <div class="cell"><span class="d">17</span></div>
      <div class="cell"><span class="d">18</span></div>
      <div class="cell"><span class="d">19</span></div>

      <div class="cell"><span class="d sun">20</span></div>
      <div class="cell"><span class="d">21</span></div>
      <div class="cell"><span class="d">22</span></div>
      <div class="cell"><span class="d">23</span></div>
      <div class="cell hol"><span class="d">24</span><span class="tag">연휴</span></div>
      <div class="cell hol"><span class="d">25</span><span class="tag">추석</span></div>
      <div class="cell hol"><span class="d">26</span><span class="tag">연휴</span></div>
    </div>

    <div class="divider"></div>
    <div class="legend">
      <span class="l1"><i></i>착유일</span>
      <span class="l2"><i></i>발송 시작</span>
      <span class="l3"><i></i>추석 연휴</span>
    </div>
    <div class="note">
      9월 배송일자 · <b>9/14 착유</b> 후 <b>9/16부터 순차 발송</b>됩니다.
    </div>
  </div>
</div>
</body>
</html>
