<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[고순] 참깨 제철 캐러셀 — 인스타</title>
<style>
  @font-face{font-family:'Saeron';src:url('../brand-font/EBS훈민정음새론L.ttf');font-weight:300;font-display:swap;}
  @font-face{font-family:'Saeron';src:url('../brand-font/EBS훈민정음새론R.ttf');font-weight:400;font-display:swap;}
  @font-face{font-family:'Saeron';src:url('../brand-font/EBS훈민정음새론SB.ttf');font-weight:700;font-display:swap;}
  @font-face{font-family:'Pretendard';src:url('../brand-font/PretendardVariable.ttf');font-weight:100 900;font-display:swap;}
  @font-face{font-family:'Mendl';src:url('../brand-font/Mendl_Sans_Dawn_Regular.otf');font-weight:400;font-display:swap;}
  @font-face{font-family:'Mendl';src:url('../brand-font/Mendl_Sans_Dawn_Medium.otf');font-weight:500;font-display:swap;}

  :root{
    --main:#e4dfac; --sub1:#cad3cf; --sub2:#36302c; --bg:#fefcf6; --accent:#ea4c36;
    --body:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;
    --disp:'Saeron','Pretendard',sans-serif;
    --latin:'Mendl',serif;
  }
  *{box-sizing:border-box;margin:0;}
  body{background:var(--bg);color:var(--sub2);font-family:var(--body);-webkit-font-smoothing:antialiased;}
  img{max-width:100%;display:block;}
  .page{width:1080px;margin:0 auto;}

  .slide{width:1080px;height:1350px;position:relative;overflow:hidden;display:flex;flex-direction:column;}
  .slide .disp{font-family:var(--disp);font-weight:700;letter-spacing:-.01em;line-height:1.22;}
  .slide .tag{font-family:var(--latin);font-size:22px;letter-spacing:.22em;text-transform:uppercase;opacity:.85;}

  /* 1. 제철 리빌 */
  .s1{background:#3a4a35;}
  .s1 img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .s1 .overlay{position:relative;z-index:1;margin-top:auto;padding:64px 64px 88px;background:linear-gradient(0deg,rgba(10,10,10,.86) 0%,rgba(10,10,10,.86) 68%,rgba(10,10,10,.3) 90%,rgba(10,10,10,0) 100%);color:#fff;text-align:left;}
  .s1 .tag{color:#fff;}
  .s1 p.line{font-size:30px;line-height:1.6;margin-top:22px;opacity:.94;}
  .s1 p.line:first-child{margin-top:22px;}
  .s1 .b{font-family:var(--disp);font-weight:700;opacity:1;}
  .s1 p.lead{font-family:var(--disp);font-weight:700;font-size:34px;line-height:1.35;opacity:1;margin-top:26px;}
  .s1 p.big{font-family:var(--disp);font-weight:700;font-size:40px;line-height:1.4;opacity:1;}
</style>
</head>
<body>
<div class="page">

<!-- 1. 참깨 제철 리빌 -->
<section class="slide s1">
  <img class="bg" src="../products/참기름캐러셀용사진/참깨클로즈업.jpeg" alt="여물어가는 국산 참깨 꼬투리 클로즈업">
  <div class="overlay">
    <p class="tag">GOSOON Harvest 2026</p>
    <p class="line big">참깨에도 제철이 있다는 사실, 알고 계셨나요?</p>
    <p class="line lead">바로 <span class="b">지금.</span></p>
    <p class="line">올해 막 수확한 참깨를 만날 수 있는<br><span class="b">딱 이 계절입니다.</span></p>
  </div>
</section>

</div>
</body>
</html>
