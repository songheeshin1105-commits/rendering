<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[고순] 참기름 — 9월 긴급성 인스타 캐러셀</title>
<style>
  @font-face{font-family:'Saeron';src:url('../brand-font/EBS훈민정음새론L.ttf');font-weight:300;font-display:swap;}
  @font-face{font-family:'Saeron';src:url('../brand-font/EBS훈민정음새론R.ttf');font-weight:400;font-display:swap;}
  @font-face{font-family:'Saeron';src:url('../brand-font/EBS훈민정음새론SB.ttf');font-weight:700;font-display:swap;}
  @font-face{font-family:'Pretendard';src:url('../brand-font/PretendardVariable.ttf');font-weight:100 900;font-display:swap;}
  @font-face{font-family:'Mendl';src:url('../brand-font/Mendl_Sans_Dawn_Regular.otf');font-weight:400;font-display:swap;}
  @font-face{font-family:'Mendl';src:url('../brand-font/Mendl_Sans_Dawn_Medium.otf');font-weight:500;font-display:swap;}

  :root{
    --main:#e4dfac; --sub1:#cad3cf; --sub2:#36302c; --bg:#fefcf6; --accent:#ea4c36;
    --body:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;
    --disp:'Saeron','Pretendard',sans-serif;
    --latin:'Mendl',serif;
  }
  *{box-sizing:border-box;margin:0;}
  body{background:var(--bg);color:var(--sub2);font-family:var(--body);-webkit-font-smoothing:antialiased;}
  img{max-width:100%;display:block;}
  .page{width:1080px;margin:0 auto;}

  .slide{width:1080px;height:1350px;position:relative;overflow:hidden;display:flex;flex-direction:column;}
  .slide .tag{font-family:var(--latin);font-size:22px;letter-spacing:.22em;text-transform:uppercase;opacity:.85;}
  .slide .disp{font-family:var(--disp);font-weight:700;letter-spacing:-.01em;line-height:1.3;}

  /* 1. 커버 — 사장님 원문 그대로 */
  .cover{background:#2a2420;}
  .cover img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.9;}
  .cover .overlay{position:relative;z-index:1;margin-top:auto;padding:64px 72px 100px;background:linear-gradient(0deg,rgba(10,10,10,.82),rgba(10,10,10,.15) 62%,rgba(10,10,10,0) 85%);color:#fff;}
  .cover .tag{color:#fff;}
  .cover h1{font-size:58px;margin-top:20px;}

  /* 2. 타이밍 펀치라인 */
  .punch{background:var(--sub2);align-items:center;justify-content:center;text-align:center;}
  .punch .lead{font-family:var(--disp);font-weight:400;font-size:40px;color:var(--main);}
  .punch .num{font-family:var(--disp);font-weight:700;font-size:220px;line-height:1;color:var(--accent);margin-top:6px;}

  /* 3. 근거 — 문장으로 끊음 */
  .proof{background:#111;}
  .proof img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .proof .overlay{position:relative;z-index:1;margin-top:auto;padding:64px 72px 100px;background:linear-gradient(0deg,rgba(10,10,10,.78),rgba(10,10,10,.1) 60%,rgba(10,10,10,0) 82%);color:#fff;}
  .proof h2{font-size:52px;line-height:1.4;}

  /* 4. 신선함 증거 */
  .fresh{background:#000;}
  .fresh img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .fresh .overlay{position:relative;z-index:1;margin-top:auto;padding:64px 72px 100px;background:linear-gradient(0deg,rgba(10,10,10,.72),rgba(10,10,10,0) 62%);color:#fff;}
  .fresh .tag{color:var(--accent);font-weight:600;}
  .fresh h2{font-size:44px;margin-top:14px;}

  /* 5. 참깨밭 한 줄 */
  .field{background:#3a4a35;}
  .field img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .field .overlay{position:relative;z-index:1;margin-top:auto;padding:64px 72px 100px;background:linear-gradient(0deg,rgba(10,10,10,.72),rgba(10,10,10,.05) 62%,rgba(10,10,10,0) 82%);color:#fff;text-align:center;}
  .field h2{font-size:44px;line-height:1.5;}

  /* 6. CTA */
  .cta{background:var(--sub2);color:var(--main);align-items:center;justify-content:center;text-align:center;padding:0 80px;}
  .cta img.logo{width:140px;margin:0 auto 40px;filter:invert(1) brightness(2);}
  .cta .msg{font-family:var(--disp);font-weight:700;font-size:36px;line-height:1.6;color:#fff;}
  .cta .en{font-family:var(--latin);font-size:24px;opacity:.7;margin-top:28px;}
  .cta .btn{margin-top:56px;border:1.5px solid rgba(255,255,255,.5);border-radius:999px;padding:18px 44px;font-size:24px;letter-spacing:.04em;color:#fff;}
</style>
</head>
<body>
<div class="page">

<!-- 1. 커버 -->
<section class="slide cover">
  <img class="bg" src="../products/들기름/images/햇참기름제품사진.png" alt="고순 햇참기름">
  <div class="overlay">
    <p class="tag">GOSOON · Harvest 2026</p>
    <h1 class="disp">1년에 딱 한 번,<br>무조건 참기름을 사야 하는 때가 있습니다.</h1>
  </div>
</section>

<!-- 2. 타이밍 펀치라인 -->
<section class="slide punch">
  <p class="lead">바로 지금</p>
  <p class="num">9월</p>
</section>

<!-- 3. 근거 -->
<section class="slide proof">
  <img class="bg" src="../products/들기름/images/햇참기름확대.png" alt="올해 수확한 참깨로 만든 고순 햇참기름">
  <div class="overlay">
    <h2 class="disp">올해 수확한 참깨로 만든<br>햇참기름.</h2>
  </div>
</section>

<!-- 4. 신선함 증거 -->
<section class="slide fresh">
  <img class="bg" src="../products/참기름캐러셀용사진/KakaoTalk_Photo_2026-09-14-19-36-41 006.jpeg" alt="갓 짜낸 참기름의 맑은 빛깔">
  <div class="overlay">
    <p class="tag">Fresh press</p>
    <h2 class="disp">이 빛깔, 갓 짜낸 증거입니다.</h2>
  </div>
</section>

<!-- 5. 참깨밭 한 줄 -->
<section class="slide field">
  <img class="bg" src="../products/들기름/images/KakaoTalk_Photo_2026-09-14-19-12-35.jpeg" alt="고순 국산 참깨밭">
  <div class="overlay">
    <h2 class="disp">국산 참깨는,<br>지금 이 계절에만.</h2>
  </div>
</section>

<!-- 6. CTA -->
<section class="slide cta">
  <img class="logo" src="../brand/logo/logo.png" alt="고순 로고">
  <p class="msg">지금이 아니면,<br>내년 9월까지 기다려야 합니다.</p>
  <p class="en">GOSOON · Harvest sesame oil</p>
  <p class="btn">프로필 링크에서 만나보세요</p>
</section>

</div>
</body>
</html>
