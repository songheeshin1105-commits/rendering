<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  @font-face{ font-family:'Pretendard'; src:url('../brand-font/PretendardVariable.ttf'); font-weight:45 920; font-display:block; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Pretendard',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; background:#fefcf6; color:#2b2622; -webkit-font-smoothing:antialiased; }
  .banner{ width:860px; }
  .txt{ text-align:center; padding:80px 52px 58px; }

  .label{ font-size:13px; font-weight:600; letter-spacing:.36em; color:#a89f88; text-transform:uppercase; }
  .label-ko{ font-size:18px; font-weight:500; letter-spacing:.32em; color:#7d7568; margin-top:10px; }

  .ship{ font-size:22px; font-weight:400; line-height:1.95; letter-spacing:-.01em; color:#3d382f; margin-top:24px; }
  mark{ background:linear-gradient(transparent 56%, #f4e04d 56%, #f4e04d 92%, transparent 92%); color:#2b2622; padding:0 2px; font-weight:600; }

  .rule{ width:36px; height:1px; background:#d9d3c4; margin:46px auto; }

  .h2{ font-size:52px; font-weight:800; letter-spacing:-.045em; line-height:1.14; }
  .h2-en{ font-size:14px; font-weight:600; letter-spacing:.34em; text-transform:uppercase; color:#a89f88; margin-top:18px; }

  .ev1{ font-size:24px; font-weight:400; line-height:1.9; letter-spacing:-.01em; color:#37322b; margin-top:30px; }
  .ev1 mark{ font-weight:600; }
  .ev2{ font-size:18.5px; font-weight:400; letter-spacing:0; color:#7d7568; margin-top:22px; }

  .banner img{ display:block; width:100%; margin-top:10px; }
</style>
</head>
<body>
<div class="banner">
  <div class="txt">
    <p class="label">Shipping Notice</p>
    <p class="label-ko">배송 안내</p>
    <p class="ship">신선한 기름을 보내드리고자<br><mark>9/14일부터 순차발송</mark> 도와드립니다.</p>
    <div class="rule"></div>
    <h2 class="h2">추석맞이 이벤트!</h2>
    <p class="h2-en">Chuseok Gift</p>
    <p class="ev1">9/23까지 구매고객 대상으로<br><mark>보자기 포장을 무료로</mark> 해드립니다.</p>
    <p class="ev2">이번 추석 명절, 소중한 사람에게 들기름을 선물해보세요</p>
  </div>
  <img src="../products/들기름/images/상세/web/s7-gift.jpg" alt="고순 보자기 포장">
</div>
</body>
</html>
