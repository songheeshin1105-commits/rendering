<!--
  히어로 섹션 (후킹 헤드라인)
  치환 토큰: {{MAIN_COLOR}} {{BG_COLOR}} {{HEADLINE}} {{SUBHEADLINE}} {{HERO_IMAGE}}
-->
<div style="background:{{BG_COLOR}}; padding:48px 24px; text-align:center;">
  <img src="{{HERO_IMAGE}}" alt="상품 사진" style="width:100%; max-width:452px; border-radius:12px; margin-bottom:24px; display:block; margin-left:auto; margin-right:auto;" onerror="this.src='';this.alt='여기에 상품 사진을 넣으세요'; this.style.background='#eee'; this.style.height='300px';">
  <h1 style="font-size:24px; line-height:1.4; font-weight:800; color:#222; margin:0 0 12px;">{{HEADLINE}}</h1>
  <p style="font-size:16px; line-height:1.6; color:#666; margin:0;">{{SUBHEADLINE}}</p>
</div>
