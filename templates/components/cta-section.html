<!--
  CTA 섹션 — 구매 버튼 또는 문의 유도
  치환 토큰: {{ACCENT_COLOR}} {{BG_COLOR}} {{CTA_TEXT}} {{CTA_BUTTON_TEXT}} {{CTA_LINK}} {{FOOTER_NOTICE}} {{SHIPPING_NOTICE}} {{BRAND_NAME}} {{CONTACT}}
-->
<div style="padding:40px 24px; background:{{BG_COLOR}}; text-align:center;">
  <p style="font-size:18px; font-weight:700; color:#222; margin:0 0 20px;">{{CTA_TEXT}}</p>
  <a href="{{CTA_LINK}}" style="display:inline-block; width:100%; max-width:400px; box-sizing:border-box; background:{{ACCENT_COLOR}}; color:#fff; font-size:17px; font-weight:700; padding:16px 0; border-radius:10px; text-decoration:none;">{{CTA_BUTTON_TEXT}}</a>
</div>
<div style="padding:24px; background:#f2f2f2; text-align:center; font-size:12px; color:#999; line-height:1.8;">
  <p style="margin:0;">{{BRAND_NAME}} | {{CONTACT}}</p>
  <p style="margin:4px 0 0;">{{SHIPPING_NOTICE}}</p>
  <p style="margin:4px 0 0;">{{FOOTER_NOTICE}}</p>
</div>
